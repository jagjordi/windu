name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }} ${{ matrix.kind }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Self-contained: one large file that runs with no .NET installed.
          - rid: win-x64
            kind: standalone
            self_contained: true
          - rid: win-arm64
            kind: standalone
            self_contained: true
          # Framework-dependent: a small file that needs the .NET 8 runtime.
          - rid: win-x64
            kind: framework-dependent
            self_contained: false
          - rid: win-arm64
            kind: framework-dependent
            self_contained: false

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ github.event.inputs.version }}'
          } else {
            $v = '${{ github.ref_name }}' -replace '^v', ''
          }
          if ($v -notmatch '^\d+\.\d+\.\d+') {
            throw "version '$v' is not in the form MAJOR.MINOR.PATCH"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "resolved version: $v"

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/Windu/Windu.csproj `
            --configuration Release `
            --runtime ${{ matrix.rid }} `
            --self-contained ${{ matrix.self_contained }} `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=${{ matrix.self_contained }} `
            -p:DebugType=none `
            -p:Version=${{ steps.version.outputs.version }} `
            --output publish
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }

      # A self-contained arm64 binary cannot run on the x64 runner, so only
      # check the one we can actually execute here.
      - name: Check the binary runs
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $v = & publish/windu.exe --version
          "reported: $v"
          if ($v -notmatch '${{ steps.version.outputs.version }}') {
            throw "binary reports '$v', expected ${{ steps.version.outputs.version }}"
          }

      - name: Name the artifact
        id: name
        shell: pwsh
        run: |
          $name = 'windu-${{ steps.version.outputs.version }}-${{ matrix.rid }}'
          if ('${{ matrix.kind }}' -eq 'framework-dependent') { $name += '-framework-dependent' }
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item publish/windu.exe staging/
          Copy-Item README.md, LICENSE staging/
          Compress-Archive -Path staging/* -DestinationPath '${{ steps.name.outputs.name }}.zip'
          Get-ChildItem *.zip | ForEach-Object { "{0,12:N0}  {1}" -f $_.Length, $_.Name }

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ steps.name.outputs.name }}.zip
          retention-days: 7

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Work out the version
        id: version
        run: |
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            v='${{ github.event.inputs.version }}'
          else
            v='${{ github.ref_name }}'
            v="${v#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Checksums let people verify a download, and cost nothing to publish.
      - name: Checksum the archives
        working-directory: artifacts
        run: |
          ls -la
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<'EOF'
          ## Downloads

          | Asset | Needs .NET 8 installed? |
          | --- | --- |
          | `windu-VERSION-win-x64.zip` | **No** — self-contained, ~35 MB |
          | `windu-VERSION-win-arm64.zip` | **No** — self-contained, ~35 MB |
          | `windu-VERSION-win-x64-framework-dependent.zip` | Yes — ~200 KB |
          | `windu-VERSION-win-arm64-framework-dependent.zip` | Yes — ~200 KB |

          Each archive holds a single `windu.exe`; unzip it anywhere and run it.
          Take a self-contained build unless .NET 8 is already installed and size matters.

          Verify a download against `SHA256SUMS.txt`:

          ```powershell
          Get-FileHash windu-VERSION-win-x64.zip -Algorithm SHA256
          ```

          ## Usage

          ```powershell
          windu.exe "C:\Program Files"
          ```

          Press `?` inside the browser for the key bindings.
          EOF
          sed -i "s/VERSION/${VERSION}/g" notes.md

          gh release create "v${VERSION}" \
            artifacts/*.zip \
            artifacts/SHA256SUMS.txt \
            --title "windu ${VERSION}" \
            --notes-file notes.md \
            --generate-notes
